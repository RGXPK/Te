<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>واجهة المعلم</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>سجل الواجبات</h1>
  <button id="toggleBtn">🔄 تغيير حالة الإرسال</button>
  <p id="status"></p>

  <table id="table">
    <thead>
      <tr>
        <th>اسم الطالب</th>
        <th>وقت الإرسال</th>
        <th>الملف</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    async function loadHomework() {
      const res = await fetch('/submissions');
      const data = await res.json();
      const tbody = document.querySelector('#table tbody');
      tbody.innerHTML = '';

      data.forEach(sub => {
        const tr = document.createElement('tr');
        const ext = sub.filename.split('.').pop().toLowerCase();
        let fileCell = "";

        if (["jpg", "jpeg", "png", "gif"].includes(ext)) {
          fileCell = `
            <a href="/uploads/${sub.filename}" target="_blank">
              <img src="/uploads/${sub.filename}" width="100">
            </a>`;
        } else {
          fileCell = `<a href="/uploads/${sub.filename}" target="_blank">📎 تحميل</a>`;
        }

        tr.innerHTML = `
          <td>${sub.name}</td>
          <td>${sub.time || "غير متوفر"}</td>
          <td>${fileCell}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function loadStatus() {
      const res = await fetch('/status');
      const data = await res.json();
      document.getElementById('status').textContent = data.isOpen
        ? "✅ الإرسال مفتوح"
        : "🚫 الإرسال مغلق";
    }

    document.getElementById('toggleBtn').onclick = async () => {
      await fetch('/toggle', { method: 'POST' });
      await loadStatus();
    };

    loadStatus();
    loadHomework();
  </script>
</body>
</html>
